name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 一套源码两个产物：SnapCore（轻量）/ SnapOCR（内置 OCR 引擎）
      - name: Build SnapCore + SnapOCR
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SnapCore-bin
          path: dist/*.exe
          if-no-files-found: error
