name: Build Windows exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # 1) 检出本仓库（ScreenCapture 源码 + 内置的 Ling 框架）
      - name: Checkout ScreenCapture
        uses: actions/checkout@v4

      # 2) 配置 MSBuild 环境（自动探测 Visual Studio 安装路径，替代写死的 VsDevCmd）
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 3) 编译 yoga.lib（Ling 已随仓库内置，输出到 Ling\x64\Release\yoga.lib）
      - name: Build Yoga
        shell: pwsh
        run: |
          msbuild Ling\yoga\yoga.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\Ling\

      # 4) 编译 Ling.lib（输出到 Ling\x64\Release\Ling.lib）
      - name: Build Ling
        shell: pwsh
        run: |
          msbuild Ling\Ling.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=${{ github.workspace }}\Ling\

      # 5) 编译 ScreenCapture.exe（Release|x64，产物在 Src\x64\Release\）
      - name: Build ScreenCapture
        shell: pwsh
        run: |
          msbuild Src\ScreenCapture.vcxproj /p:Configuration=Release /p:Platform=x64

      # 6) 上传 exe 产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCapture-exe
          path: |
            Src\x64\Release\ScreenCapture.exe
          if-no-files-found: error
